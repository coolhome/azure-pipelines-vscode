#                                           ^ punctuation.definition.string.end.yaml
#                                            ^ punctuation.separator.key-value.mapping.yaml
  - script: echo hi
# ^ punctuation.definition.block.sequence.item.yaml
#   ^^^^^^ string.unquoted.plain.out.yaml entity.name.tag.yaml

- "${{ each region in split('a', ',') }}":
# ^ punctuation.definition.string.begin.yaml
#  ^ meta.template.expression.azure-pipelines punctuation.definition.expression.sigil.azure-pipelines
